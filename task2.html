<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Task 2</title>
</head>
<body class="p-3">
    <p id="oldParagraph">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Officiis harum totam ex! Quas blanditiis molestias dolor tempore eaque atque maxime numquam nam asperiores aliquid accusamus quaerat, sit, nostrum odio in.</p>
    <button class="btn btn-dark" id="chButton">Change paragraph</button>
    <script>
        const btn = document.getElementById("chButton");
        const paragraph = document.getElementById("oldParagraph");

        btn.addEventListener("click", function() {
            paragraph.textContent = "You clicked the button";
        });
    </script>
</body>
</html>
