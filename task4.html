<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Task 3</title>
</head>
<body class="p-3">
    <label>List of products</label>
    <ul id="list">
        <li>Coca-cola</li>
        <li>Milk</li>
        <li>Bread</li>
    </ul>
    <button class="btn btn-dark" id="addButton">Add item</button>
    <button class="btn btn-dark" id="delButton">Delete item</button>
    <script>
        const addBtn = document.getElementById("addButton");
        const delBtn = document.getElementById("delButton");
        const list = document.getElementById("list");
        
        addBtn.addEventListener("click", function(){
            const newItem = document.createElement("li");
            let product = prompt("Product name");
            newItem.textContent = product;
            list.appendChild(newItem);  
        });
        delBtn.addEventListener("click", function(){
            const lastItem = list.lastElementChild;
            if(lastItem) {
                list.removeChild(lastItem);
            }
            else {
                alert("List is empty")
            }
        });
    </script>
</body>
</html>
