<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Task 6</title>
</head>
<body class="p-3">
    <input type="text" id="textInput" style="width: 250px;" placeholder="Input something...">
    <p style="font-size: 16px;">You entered: <span id="output" style="font-weight: bold; color: #2980b9;"></span></p>
    <script>

        const textInput = document.getElementById("textInput");
        const output = document.getElementById("output");
        textInput.addEventListener("keyup", function(){
            output.textContent = textInput.value;
        });
    </script>
</body>
</html>
