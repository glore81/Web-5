<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Task 8</title>
</head>
<body class="bg-light p-5">

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h3 class="mb-4 text-center fw-bold">To-Do list</h3>
                <div id="taskList" class="d-flex flex-column gap-3">

                </div>
            </div>

            <div class="col-md-6">
                <h3 class="mb-4 fw-bold text-center">Add new task</h3>
                <div class="card shadow-sm p-4 mb-4">
                    <div class="mb-3">
                        <label class="form-label text-muted small">* Title</label>
                        <input type="text" class="form-control bg-light" id="taskTitle" placeholder="Assignment">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small">* Description</label>
                        <textarea class="form-control bg-light" id="taskDesc" rows="5" placeholder="Complete assignment on time"></textarea>
                    </div>

                    <button id="addTaskBtn" class="btn btn-primary py-2" style="background-color: #5b46f4; border: none;">Add task</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let tasks = [];
        const taskTitle = document.getElementById("taskTitle");
        const taskDesc = document.getElementById("taskDesc");
        const addTaskBtn = document.getElementById("addTaskBtn");
        const taskList = document.getElementById("taskList");

        function renderTasks() {
            taskList.innerHTML = "";

            if(tasks.length == 0){
                taskList.innerHTML = `<p class="text-muted">No tasks yet.</p>`;
                return;
            }

            tasks.forEach((task, index) => {
                const card = document.createElement("div");

                card.className = "card p-3 shadow-sm task-card";
            
                card.innerHTML = `
                <div class="d-flex justify-content-between align-items-start">
                    <div class="flex-grow-1 task-content" style="cursor: pointer;">
                        <h5 class="fw-bold mb-1 ${task.completed ? 'completed' : ''}">${task.title}</h5>
                        <p class="text-secondary mb-0 ${task.completed ? 'completed' : ''}">${task.desc}</p>
                    </div>
                    <button class="btn btn-outline-danger btn-sm delete-btn">Delete</button>
                </div>
                        `
                
                card.querySelector(".task-content").addEventListener("click", () => {
                    task.completed = !task.completed;
                    renderTasks();
                });

                card.querySelector(".delete-btn").addEventListener("click", (e) => {
                    e.stopPropagation();
                    tasks.splice(index, 1);
                    renderTasks();
                });

                taskList.appendChild(card);
            });
        }

        addTaskBtn.addEventListener("click", function() {
            let title = taskTitle.value.trim();
            let desc = taskDesc.value.trim();
            if (title === "" || desc === "") {
                alert("Please fill in both fields!");
                return;
            }

            tasks.push({
                title: title,
                desc: desc,
                completed: false
            });

            taskTitle.value = "";
            taskDesc.value = "";

            renderTasks();
        });

        renderTasks();
    </script>
</body>
</html>
